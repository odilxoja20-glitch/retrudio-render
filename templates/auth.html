{% extends "base.html" %}
{% block content %}
<form method="post" class="panel stack narrow">
  <h1>{{ t('register') if mode == 'register' else t('login') }}</h1>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {% if mode == 'register' %}<label>{{ t('name') }}<input name="name" required maxlength="60"></label>{% endif %}
  <label>{{ t('email') }}<input type="{{ 'text' if mode == 'login' else 'email' }}" name="email" required></label>
  <label>{{ t('password') }}<input type="password" name="password" required minlength="8"></label>
  <button class="btn">{{ t('register') if mode == 'register' else t('login') }}</button>
  {% if mode == 'login' %}<p class="muted">{{ t('no_account') }} <a href="{{ url_for('register') }}">{{ t('register') }}</a></p>
  {% else %}<p class="muted">{{ t('have_account') }} <a href="{{ url_for('login') }}">{{ t('login') }}</a></p>{% endif %}
</form>
{% endblock %}
