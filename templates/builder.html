{% extends "base.html" %}
{% block title %}{{ t('nav_builder') }} — {{ PROJECT_NAME }}{% endblock %}
{% block content %}
<h1>{{ t('nav_builder') }}</h1>
<p class="muted">{{ t('hint_builder') }}</p>
<div class="builder">
  <aside class="panel palette" id="palette"></aside>
  <div class="stage">
    <div class="toolbar">
      <label>{{ t('wire_color') }} <input type="color" id="wireColor" value="#3ee0ff"></label>
      <button class="btn small ghost" id="btnDelete">{{ t('delete') }}</button>
      <button class="btn small ghost" id="btnClear">{{ t('clear') }}</button>
      <input id="designTitle" placeholder="{{ t('title') }}" maxlength="100">
      <label><input type="checkbox" id="designPublic"> {{ t('public') }}</label>
      <button class="btn small" id="btnSave">{{ t('save') }}</button>
      <span id="status" class="muted"></span>
    </div>
    <svg id="canvas" tabindex="0"></svg>
  </div>
  <aside class="panel mydesigns"><h3>{{ t('my_designs') }}</h3><ul id="myDesigns"></ul></aside>
</div>
{% endblock %}
{% block scripts %}
<script>window.BUILDER = {designId: {{ design_id if design_id else 'null' }}, loggedIn: {{ 'true' if user else 'false' }}, csrf: "{{ csrf }}", savedLabel: "{{ t('saved') }}", needLogin: "{{ t('need_login') }}"};</script>
<script src="{{ url_for('static', filename='builder.js') }}"></script>
{% endblock %}
