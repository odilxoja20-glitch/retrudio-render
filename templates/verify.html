{% extends "base.html" %}
{% block content %}
<form method="post" class="panel stack narrow">
  <h1>{{ t('verify_title') }}</h1>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <p class="muted">{{ t('verify_sent') }} <b>{{ email }}</b></p>
  <label>{{ t('verify_code') }}<input name="code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" autofocus></label>
  <button class="btn">{{ t('verify_btn') }}</button>
  <button class="btn" formaction="{{ url_for('verify_resend') }}" formnovalidate>{{ t('verify_resend') }}</button>
</form>
{% endblock %}
